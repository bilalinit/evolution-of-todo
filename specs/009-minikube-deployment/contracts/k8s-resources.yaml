## Resource Relationships

```mermaid
graph TD
    User[User Browser] -->|HTTP| Tunnel[minikube tunnel]
    Tunnel -->|TCP| LB[LoadBalancer Service: frontend]
    LB --> Pod1[Frontend Pod]
    LB --> Pod2[Frontend Pod]
    Pod1 -->|HTTP| DNS[Kubernetes DNS]
    Pod2 -->|HTTP| DNS
    DNS -->|backend:8000| CIP[ClusterIP Service: backend]
    CIP --> Pod3[Backend Pod]
    CIP --> Pod4[Backend Pod]
    Pod3 -->|SSL| Neon[Neon PostgreSQL]
    Pod4 -->|SSL| Neon
    Pod3 -->|envFrom| Secret[app-secrets]
    Pod4 -->|envFrom| Secret
```

