## Resource Quotas (Optional)

For resource management, optionally apply quotas:

```yaml
apiVersion: v1
kind: ResourceQuota
metadata:
  name: todo-app-quota
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    persistentvolumeclaims: "0"
```

---

## Network Policies (Optional)

For network security, optionally apply policies:

```yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: todo-app-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: todo-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: todo-app
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: todo-app
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 5432  # PostgreSQL
```

