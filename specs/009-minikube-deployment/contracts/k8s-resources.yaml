# Kubernetes Resources Reference

**Feature**: 009-minikube-deployment
**Date**: 2026-01-26

This document provides a complete reference of all Kubernetes resources created during the Minikube deployment.

---

## Complete Resource List

### Frontend Resources

| Resource | Name | Type | Purpose |
|----------|------|------|---------|
| Deployment | `frontend` | apps/v1 | Manages frontend pods |
| Service | `frontend` | v1/LoadBalancer | Exposes frontend externally |
| Pod | `frontend-<hash>` | v1 | Frontend application instance |

### Backend Resources

| Resource | Name | Type | Purpose |
|----------|------|------|---------|
| Deployment | `backend` | apps/v1 | Manages backend pods |
| Service | `backend` | v1/ClusterIP | Internal backend access |
| Pod | `backend-<hash>` | v1 | Backend application instance |

### Configuration Resources

| Resource | Name | Type | Purpose |
|----------|------|------|---------|
| Secret | `app-secrets` | v1/Secret | Sensitive configuration |
| ConfigMap | `backend-config` | v1/ConfigMap | Non-sensitive configuration |

---

## Complete YAML Specifications

### 1. Frontend Deployment

```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/instance: frontend
    spec:
      serviceAccountName: frontend
      securityContext:
        fsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
      containers:
      - name: frontend
        image: todo-frontend:v1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: API_URL
          value: "http://backend:8000"
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
```

### 2. Frontend Service

```yaml
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: todo-app
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: frontend
  ports:
  - name: http
    protocol: TCP
    port: 3000
    targetPort: http
  sessionAffinity: None
```

### 3. Frontend ServiceAccount

```yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: frontend
automountServiceAccountToken: false
```

### 4. Backend Deployment

```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/instance: backend
    spec:
      serviceAccountName: backend
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: backend
        image: todo-backend:v1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        envFrom:
        - secretRef:
            name: app-secrets
        - configMapRef:
            name: backend-config
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
```

### 5. Backend Service

```yaml
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: todo-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
  - name: http
    protocol: TCP
    port: 8000
    targetPort: http
  sessionAffinity: None
```

### 6. Backend ServiceAccount

```yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: backend
automountServiceAccountToken: false
```

### 7. Application Secrets

```yaml
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  labels:
    app.kubernetes.io/part-of: todo-app
type: Opaque
stringData:
  # Database Connection (Neon PostgreSQL)
  DATABASE_URL: "postgresql+asyncpg://user:password@ep-xxx.aws.neon.tech/dbname?sslmode=require"

  # OpenAI API for Agents SDK
  OPENAI_API_KEY: "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

  # Xiaomi Model API Key
  XIAOMI_API_KEY: "your_xiaomi_api_key_here"

  # Better Auth JWT Secret
  BETTER_AUTH_SECRET: "your-secret-key-here-min-32-chars"

  # MCP Server Configuration
  MCP_SERVER_TIMEOUT: "30"
```

### 8. Backend ConfigMap

```yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  labels:
    app.kubernetes.io/part-of: todo-app
data:
  # Server Configuration
  HOST: "0.0.0.0"
  PORT: "8000"
  DEBUG: "false"

  # CORS Configuration
  CORS_ORIGINS: "http://localhost:3000,http://frontend:3000"
```

