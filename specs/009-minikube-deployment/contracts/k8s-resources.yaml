## Resource Status Commands

```bash
# View all resources
kubectl get all

# View specific resource types
kubectl get deployments,services,pods

# View resources with labels
kubectl get all -l app.kubernetes.io/part-of=todo-app

# Describe a resource
kubectl describe deployment frontend
kubectl describe service backend
kubectl describe pod frontend-<hash>

# View resource YAML
kubectl get deployment frontend -o yaml
kubectl get service backend -o yaml
```

---

## Troubleshooting Commands

```bash
# Pod issues
kubectl describe pod <pod-name>
kubectl logs <pod-name>
kubectl logs <pod-name> --previous  # Previous container instance

# Service issues
kubectl describe service <service-name>
kubectl get endpoints <service-name>

# Secret issues
kubectl get secret app-secrets -o yaml
kubectl get secret app-secrets -o jsonpath='{.data.DATABASE_URL}' | base64 -d

# General cluster issues
kubectl get events --sort-by=.metadata.creationTimestamp
kubectl top nodes  # Resource usage
kubectl top pods   # Resource usage
```

---

## Resource Deletion

```bash
# Delete all resources created by Helm
helm uninstall frontend
helm uninstall backend

# Delete secrets
kubectl delete secret app-secrets
kubectl delete configmap backend-config

# Delete specific resources
kubectl delete deployment frontend
kubectl delete service backend
kubectl delete pod frontend-<hash>
```

