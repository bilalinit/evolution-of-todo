## Summary

This reference provides complete specifications for all Kubernetes resources used in the Minikube deployment. The resources are created and managed via Helm charts, but the YAML specifications can be used for:

1. Understanding the complete resource structure
2. Manual deployment (without Helm)
3. Troubleshooting and debugging
4. Custom resource creation
5. Production migration planning
