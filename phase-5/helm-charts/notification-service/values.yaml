# Default values for notification-service with Dapr sidecar
replicaCount: 1

image:
  repository: phase5-backend
  pullPolicy: IfNotPresent
  tag: "v1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8002

# Dapr configuration
dapr:
  enabled: true
  appId: "notification-service"
  appPort: 8002
  config: "app-config"
  components: ["pubsub", "statestore"]
  # Mount custom components from ConfigMap
  resourcesMountPath: "/components"
  # Volume mounts for Dapr sidecar
  volumeMounts:
    - name: reminder-cron-component
      mountPath: /components
      readOnly: true

# Volumes for Dapr components
volumes:
  - name: reminder-cron-component
    configMap:
      name: reminder-cron-binding

env:
  HOST: "0.0.0.0"
  PORT: "8002"
  SERVICE_NAME: "notification_service"
  DEBUG: "true"

envFrom:
  - secretRef:
      name: app-secrets

# Command to run the specific microservice entrypoint
command: ["/bin/sh", "-c"]
args: ["exec uvicorn backend.services.microservices.notification_service:app --host 0.0.0.0 --port ${PORT}"]

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: http
  hostnames:
  - chart-example.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# Volume for Dapr cron binding component
volumes:
  - name: reminder-cron-component
    configMap:
      name: reminder-cron-binding

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
