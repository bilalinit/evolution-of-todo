# Docker Compose for local development of Phase 5 microservices
# This setup runs Redpanda and all microservices with Dapr sidecars
# without requiring Minikube for faster development iteration.

version: "3.8"

services:
  # Redpanda (Kafka-compatible message broker)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.4
    container_name: redpanda
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
    ports:
      - "9092:9092"   # Kafka API
      - "19092:19092" # External Kafka API
      - "8081:8081"   # Schema Registry
      - "8082:8082"   # HTTP Proxy
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Health: OK' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Create Kafka topics on startup
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.4
    container_name: redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    command: >
      sh -c "
      rpk topic create task-created --brokers redpanda:9092 || true;
      rpk topic create task-updated --brokers redpanda:9092 || true;
      rpk topic create task-completed --brokers redpanda:9092 || true;
      rpk topic create task-deleted --brokers redpanda:9092 || true;
      rpk topic create reminder-due --brokers redpanda:9092 || true;
      rpk topic create task-updates --brokers redpanda:9092 || true;
      echo 'Kafka topics created successfully';
      "
    networks:
      - phase5-network

  # PostgreSQL database (external or shared)
  # Uncomment if running local PostgreSQL instead of Neon
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: postgres
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: todo
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - phase5-network

  # Dapr placement service (for actor support if needed)
  dapr-placement:
    image: daprio/dapr:1.12.0
    container_name: dapr-placement
    command: ["./placement", "-port", "50005"]
    ports:
      - "50005:50005"
    networks:
      - phase5-network

  # Backend API (main service)
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-api
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
      - DAPR_HOST=dapr-backend-api
      - DAPR_HTTP_PORT=3500
    depends_on:
      - redpanda-init
    ports:
      - "8000:8000"
    networks:
      - phase5-network

  # Dapr sidecar for backend-api
  dapr-backend-api:
    image: daprio/dapr:1.12.0
    container_name: dapr-backend-api
    command: >
      ./daprd
      -app-id backend-api
      -app-port 8000
      -dapr-http-port 3500
      -dapr-grpc-port 50001
      -placement-host-address dapr-placement:50005
      -components-path /components
    volumes:
      - ./k8s-dapr/components/local:/components
    depends_on:
      - backend-api
      - dapr-placement
    ports:
      - "3500:3500"   # Dapr HTTP
      - "50001:50001" # Dapr gRPC
    network_mode: service:backend-api

  # Recurring Service
  recurring-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recurring-service
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - SERVICE_NAME=recurring_service
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - redpanda-init
    command: ["python", "-m", "backend.services.microservices.recurring_service"]
    networks:
      - phase5-network

  # Dapr sidecar for recurring-service
  dapr-recurring-service:
    image: daprio/dapr:1.12.0
    container_name: dapr-recurring-service
    command: >
      ./daprd
      -app-id recurring-service
      -app-port 8001
      -dapr-http-port 3501
      -dapr-grpc-port 50002
      -placement-host-address dapr-placement:50005
      -components-path /components
    volumes:
      - ./k8s-dapr/components/local:/components
    depends_on:
      - recurring-service
      - dapr-placement
    network_mode: service:recurring-service

  # Notification Service
  notification-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notification-service
    environment:
      - HOST=0.0.0.0
      - PORT=8002
      - SERVICE_NAME=notification_service
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - redpanda-init
    command: ["python", "-m", "backend.services.microservices.notification_service"]
    networks:
      - phase5-network

  # Dapr sidecar for notification-service
  dapr-notification-service:
    image: daprio/dapr:1.12.0
    container_name: dapr-notification-service
    command: >
      ./daprd
      -app-id notification-service
      -app-port 8002
      -dapr-http-port 3502
      -dapr-grpc-port 50003
      -placement-host-address dapr-placement:50005
      -components-path /components
    volumes:
      - ./k8s-dapr/components/local:/components
    depends_on:
      - notification-service
      - dapr-placement
    network_mode: service:notification-service

  # Audit Service
  audit-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audit-service
    environment:
      - HOST=0.0.0.0
      - PORT=8003
      - SERVICE_NAME=audit_service
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - redpanda-init
    command: ["python", "-m", "backend.services.microservices.audit_service"]
    networks:
      - phase5-network

  # Dapr sidecar for audit-service
  dapr-audit-service:
    image: daprio/dapr:1.12.0
    container_name: dapr-audit-service
    command: >
      ./daprd
      -app-id audit-service
      -app-port 8003
      -dapr-http-port 3503
      -dapr-grpc-port 50004
      -placement-host-address dapr-placement:50005
      -components-path /components
    volumes:
      - ./k8s-dapr/components/local:/components
    depends_on:
      - audit-service
      - dapr-placement
    network_mode: service:audit-service

  # WebSocket Service
  websocket-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: websocket-service
    environment:
      - HOST=0.0.0.0
      - PORT=8004
      - SERVICE_NAME=websocket_service
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - redpanda-init
    command: ["python", "-m", "backend.services.microservices.websocket_service"]
    ports:
      - "8004:8004"
    networks:
      - phase5-network

  # Dapr sidecar for websocket-service
  dapr-websocket-service:
    image: daprio/dapr:1.12.0
    container_name: dapr-websocket-service
    command: >
      ./daprd
      -app-id websocket-service
      -app-port 8004
      -dapr-http-port 3504
      -dapr-grpc-port 50005
      -placement-host-address dapr-placement:50005
      -components-path /components
    volumes:
      - ./k8s-dapr/components/local:/components
    depends_on:
      - websocket-service
      - dapr-placement
    network_mode: service:websocket-service

networks:
  phase5-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
