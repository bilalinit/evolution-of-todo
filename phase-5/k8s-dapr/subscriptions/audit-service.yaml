---
# Dapr Pub/Sub Subscriptions for Audit Service
#
# The audit service subscribes to all task events for logging.

apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: audit-service-task-created
  namespace: default
spec:
  pubsubname: pubsub
  topic: task-created
  routes:
    default: /events/task-created
scopes:
  - audit-service
---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: audit-service-task-updated
  namespace: default
spec:
  pubsubname: pubsub
  topic: task-updated
  routes:
    default: /events/task-updated
scopes:
  - audit-service
---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: audit-service-task-completed
  namespace: default
spec:
  pubsubname: pubsub
  topic: task-completed
  routes:
    default: /events/task-completed
scopes:
  - audit-service
---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: audit-service-task-deleted
  namespace: default
spec:
  pubsubname: pubsub
  topic: task-deleted
  routes:
    default: /events/task-deleted
scopes:
  - audit-service
