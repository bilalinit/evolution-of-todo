---
# Dapr Pub/Sub Subscription for Recurring Service
#
# This subscription ensures only the recurring-service receives task-completed events
# for generating the next instance of recurring tasks.

apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: recurring-service-task-completed
  namespace: default
spec:
  pubsubname: pubsub
  topic: task-completed
  routes:
    default: /events/task-completed
scopes:
  - recurring-service
